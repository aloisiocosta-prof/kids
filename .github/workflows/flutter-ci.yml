name: Flutter CI and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Flutter app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Generate Web and Android platform scaffolding
        run: flutter create --platforms=web,android --project-name=pequenos_protagonistas .

      - name: Set Android minimum SDK
        run: python3 scripts/set_android_min_sdk.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format .

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build WebAssembly site for GitHub Pages
        run: flutter build web --release --wasm --web-content-hash --base-href /kids/

      - name: Add no-Jekyll marker
        run: touch build/web/.nojekyll

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Build Android APK
        run: flutter build apk --debug

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
